<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061f33">
  <title>Sigma Chi Die League</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <button class="brand" data-route="home" aria-label="Home"><span class="die-mark">ΣΧ</span><span><b>SIGMA CHI</b><small>Die League</small></span></button>
    <nav id="mainNav" aria-label="Main navigation">
      <button data-route="home">Home</button>
      <button data-route="stats">Stats</button>
      <button data-route="teams">Teams</button>
      <button data-route="data">Merge</button>
    </nav>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div id="modalContent"></div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
